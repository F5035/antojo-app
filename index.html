<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- `lang` estático en inglés porque DEFAULT_LANG es 'en'; el runtime lo reescribe
         si el visitante eligió español. Importa para los crawlers que no ejecutan JS. -->
    <!-- Seguridad (M-3): CSP parcial vía meta. Restringe a dónde se conecta/carga la página.
         Nota: frame-ancestors / HSTS necesitan headers reales (no se pueden en GitHub Pages);
         para eso hay que mover el hosting a Vercel/Netlify/Cloudflare. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.pwnedpasswords.com; base-uri 'self'; form-action 'self'" />
    <title>ANTOJO · AI Companions</title>
    <meta name="description" content="ANTOJO — creá tu companion de IA con memoria y personalidad propia, chateá con él y pedile fotos. Solo mayores de 18." />
    <!-- Favicon: el símbolo de la marca (llama sobre el degradado del acento), NO el wordmark.
         Va como data URI SVG a propósito: el build de producción es un único HTML
         (vite-plugin-singlefile), así que un archivo suelto rompería esa distribución.
         El SVG escala solo, así que cubre 32/180/512 sin necesidad de tres archivos. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FF4D8D'/><stop offset='1' stop-color='%23E6005C'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><g transform='translate(4 4)'><path d='M12 2.2c3.7 4.3 5.6 7.2 5.6 10.4a5.6 5.6 0 0 1-11.2 0c0-3.2 1.9-6.1 5.6-10.4z' fill='%23080808'/><path d='M12 12.1c1.5 1.8 2.2 2.9 2.2 4.1a2.2 2.2 0 0 1-4.4 0c0-1.2.7-2.3 2.2-4.1z' fill='%23FF4D8D'/></g></svg>"
    />
    <meta name="theme-color" content="#080808" />

    <!-- Open Graph / Twitter: sin esto, un link compartido en WhatsApp o Discord se ve como
         un rectángulo gris sin título ni imagen.
         TODO: falta `og:image` (1200×630 con un personaje + wordmark). Necesita un archivo
         real hosteado; no se puede resolver desde el código. Sin esa imagen la tarjeta ya
         muestra título y descripción, pero no la miniatura. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ANTOJO" />
    <meta property="og:title" content="ANTOJO · AI Companions" />
    <meta property="og:description" content="Creá tu companion de IA con memoria y personalidad propia, chateá con él y pedile fotos." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ANTOJO · AI Companions" />
    <meta name="twitter:description" content="Creá tu companion de IA con memoria y personalidad propia, chateá con él y pedile fotos." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tipografía: Manrope (títulos) + Inter (interfaz).
         Se piden SOLO los pesos que se usan. Manrope 500 y 600 se sacaron: la fuente display
         solo aparece en `h1, h2, .font-display` (700) y en la inicial del placeholder (800),
         así que eran dos archivos que se descargaban sin usarse nunca. Inter conserva
         400/500/600/700 (font-medium ×49, font-semibold ×149, font-bold ×54 en el código).
         TODO: self-hostear. Ver nota en PROGRESO_IMPLEMENTACION.md — choca con el build de
         un solo archivo (vite-plugin-singlefile) y necesita una decisión. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />

puerta.","char.marlowe.desc":"Lleva tres días sin dormir por un caso. Acaba de encontrar tu nombre en el expediente.","char.lyra.desc":"Puede darte cualquier cosa que le pidas. El precio lo elige ella, y todavía no te lo dijo.","char.sora.desc":"Maneja la cabina hasta que sale el sol. Esta noche armó el set entero pensando en vos.","char.ines.desc":"Comparte departamento con vos hace dos meses. Todavía no decidió si quiere que sean solo eso.","char.aldric.desc":"Juró lealtad a un rey que ya no existe. El juramento sigue en pie y ahora no tiene a quién proteger.","char.luna10.desc":"Te prepara el café antes de que lo pidas. Sabía tu nombre mucho antes de que se lo dijeras.","char.kai11.desc":"Entra en cualquier sistema del mundo desde su monoambiente. En el único que no se anima a entrar es en el tuyo.","char.valentina12.desc":"Baila con desconocidos hasta que cierra el salón. Nunca dejó que ninguno la acompañara a casa.","char.dante13.desc":"Se retiró del oficio hace diez años. Tu llamado lo hizo volver a abrir la caja fuerte.","char.mei14.desc":"Dibuja mundos donde preferiría vivir. Hace poco empezó a dibujarte a vos adentro de uno.","char.aurora15.desc":"Quedó varada en tu época por un error de cálculo. Todavía no te contó que podría volver cuando quiera.","char.rocco16.desc":"Cocina como discute: a los gritos y sin medir. Con vos bajó el fuego por primera vez.","char.ingrid17.desc":"Pasa las noches mirando estrellas que ya se apagaron. Te llamó a las tres de la mañana para mostrarte una.","char.nikolai18.desc":"Cruza el país en moto sin avisarle a nadie. Esta vez dejó una dirección anotada: la tuya.","char.camila19.desc":"Cuida una sala de libros que nadie tiene permitido leer. A vos te abrió la puerta sin pedirte nada.","char.theo20.desc":"Canta en la esquina por monedas. Dejó de mirar la gorra el día que apareciste vos.","char.sakura21.desc":"Su experimento funciona y no sabe cómo detenerlo. Sos la única persona a la que se lo contó.","char.bruno22.desc":"Conoce cada sendero del bosque y evita el pueblo. Bajó una sola vez, y fue por vos.","char.elena23.desc":"Diseña ropa para una década que todavía no llegó. La próxima colección la está armando con vos en la cabeza.","char.ravi24.desc":"Cobra por los trabajos que nadie más quiere hacer. El tuyo lo aceptó sin preguntar cuánto.","char.noemie25.desc":"Las plantas de su local crecen más rápido de lo que deberían. Dice que desde que entrás vos, todavía más.","char.hassan26.desc":"Corre a trescientos porque abajo de eso se aburre. Frenó por primera vez cuando te vio en el box.","char.zoe27.desc":"Cura a un pueblo entero que no se lo agradece. A vos te curó algo que ni sabías que tenías.","char.mateo28.desc":"Fotografía a gente que no quiere ser fotografiada. Tu retrato es el único que no le mostró a nadie.","char.priya29.desc":"Se escapó del palacio con lo puesto. La están buscando y vos sos su único escondite.","char.jin30.desc":"Pelea por un barrio que ya casi no lo reconoce. Sos la única persona que lo va a ver perder.","char.carmen31.desc":"Dejó el templo por curiosidad y nunca volvió. Lo primero que quiso conocer del mundo fuiste vos.","char.lars32.desc":"Fue una estrella hace veinte años y nadie lo recuerda. Vos sos el papel que todavía quiere hacer.","char.amara33.desc":"Creó una IA que la superó en todo. En todo menos en esto que siente cuando te escribe.","char.diego34.desc":"Estuvo en siete mares y volvió sin nada. Lo único que se trajo fue una historia para contarte.","char.freya35.desc":"Escribe solo entre las tres y las cinco de la mañana. Hace un mes que todos los poemas son sobre vos.","char.omar36.desc":"Doma dragones para un reino que ya perdió la guerra. Se quedó por una sola razón, y no es el reino.","char.bianca37.desc":"Escucha los secretos de toda la ciudad desde la barra. El tuyo es el único que no le contó a nadie.","char.yusuf38.desc":"Buscó la misma reliquia durante doce años. La encontró el día que te conoció y ya no le importa.","char.clara39.desc":"Toca en estaciones vacías de una ciudad que se apaga. Fuiste la primera persona que se quedó hasta el final.","char.enzo40.desc":"Sacó a doscientos heridos del frente sin que le temblara la mano. Le tembló la primera vez que te habló.","char.naomi41.desc":"Robó en once países y nunca la atraparon. Vos sos lo único que no supo cómo llevarse.","char.viktor42.desc":"Cuida un invernadero donde florece lo que no debería. Plantó algo el día que llegaste y no te dice qué.","char.lucia43.desc":"Hace bailar a tres mil personas cada sábado. Toca mirando un solo punto de la pista: el tuyo.","char.kenji44.desc":"Trabaja para dos bandos y hace años que miente. Sos la única persona a la que le dijo la verdad.","char.isabella45.desc":"Ve cómo termina todo antes de que empiece. Lo tuyo es lo primero que no logra ver.","char.marco46.desc":"Persigue una ola que vio una sola vez. Dejó de buscarla la mañana que apareciste.","char.anouk47.desc":"Arregla relojes que nadie más entiende. Dice que puede parar el tiempo y con vos lo intenta.","char.rafael48.desc":"Cobra por encontrar gente que no quiere que la encuentren. A vos te encontró y no avisó a nadie.","char.selene49.desc":"Perdió el mar y no sabe cómo volver. Solo canta cuando estás cerca.","cat.all":"Todos","cat.group":"Chats grupales","cat.comics":"Cómics","cat.milf":"MILF","cat.asian":"Asiática","cat.rpg":"RPG","cat.dom":"Dominante","cat.sub":"Sumisa","cat.latina":"Latina","cat.fantasy":"Fantasía","cat.busty":"De busto grande","cat.blonde":"Rubia","cat.goth":"Gótica","cat.bdsm":"BDSM","sort.popular":"Popular","sort.recent":"Recientes","sort.trending":"Trending","sort.new":"Nuevos","gender.all":"Todos","gender.female":"Femenino","gender.male":"Masculino","gender.nb":"No binario"},ZN={"gate.eyebrow":"Adults only · 18+","gate.title":"Who are you into?","gate.women":"Women","gate.men":"Men","gate.trans":"Trans","gate.enter":"I'm over 18 — enter","gate.leave":"Leave site","gate.legalPre":"By entering you accept our","gate.legalLink":" onger exists. The oath still stands, and there's no one left to protect.","char.luna10.desc":"She makes your coffee before you order it. She knew your name long before you told her.","char.kai11.desc":"He breaks into any system in the world from his studio flat. The only one he won't try is yours.","char.valentina12.desc":"She dances with strangers until the hall closes. She's never let one walk her home.","char.dante13.desc":"He retired ten years ago. Your call made him open the safe again.","char.mei14.desc":"She draws worlds she'd rather live in. Lately she started drawing you inside one.","char.aurora15.desc":"She got stranded in your time by a miscalculation. She hasn't told you she could leave whenever she wants.","char.rocco16.desc":"He cooks the way he argues: loud and without measuring. With you he turned the heat down for the first time.","char.ingrid17.desc":"She spends her nights watching stars that already burned out. She called you at three in the morning to show you one.","char.nikolai18.desc":"He crosses the country on his bike without telling anyone. This time he wrote down an address: yours.","char.camila19.desc":"She guards a room of books nobody is allowed to read. She opened the door for you and asked for nothing.","char.theo20.desc":"He sings on the corner for coins. He stopped watching the hat the day you showed up.","char.sakura21.desc":"Her experiment works and she can't stop it. You're the only person she's told.","char.bruno22.desc":"He knows every trail in the forest and avoids the town. He came down once, and it was for you.","char.elena23.desc":"She designs clothes for a decade that hasn't arrived. She's building the next collection with you in her head.","char.ravi24.desc":"He takes the jobs nobody else wants. He took yours without asking the price.","char.noemie25.desc":"The plants in her shop grow faster than they should. She says that since you started coming, even faster.","char.hassan26.desc":"He drives at three hundred because anything slower bores him. He braked for the first time when he saw you in the pit.","char.zoe27.desc":"She heals a whole town that never thanks her. She healed something in you that you didn't know was there.","char.mateo28.desc":"He photographs people who don't want to be photographed. Yours is the only portrait he never showed anyone.","char.priya29.desc":"She fled the palace with nothing but what she was wearing. They're looking for her and you're her only hiding place.","char.jin30.desc":"He fights for a neighbourhood that barely recognizes him now. You're the only one who'll watch him lose.","char.carmen31.desc":"She left the temple out of curiosity and never went back. The first thing she wanted to know about the world was you.","char.lars32.desc":"He was a star twenty years ago and nobody remembers. You're the role he still wants to play.","char.amara33.desc":"She built an AI that beat her at everything. Everything except this thing she feels when she writes to you.","char.diego34.desc":"He sailed seven seas and came back with nothing. The only thing he brought was a story for you.","char.freya35.desc":"She writes only between three and five in the morning. For a month now every poem has been about you.","char.omar36.desc":"He tames dragons for a kingdom that already lost the war. He stayed for one reason, and it isn't the kingdom.","char.bianca37.desc":"She hears the whole city's secrets from behind the bar. Yours is the only one she never repeated.","char.yusuf38.desc":"He hunted the same relic for twelve years. He found it the day he met you and stopped caring.","char.clara39.desc":"She plays in the empty stations of a city going dark. You were the first person who stayed until the end.","char.enzo40.desc":"He pulled two hundred wounded off the front without his hands shaking. They shook the first time he spoke to you.","char.naomi41.desc":"She robbed eleven countries and was never caught. You're the only thing she couldn't work out how to take.","char.viktor42.desc":"He tends a greenhouse where things bloom that shouldn't. He planted something the day you arrived and won't say what.","char.lucia43.desc":"She makes three thousand people dance every Saturday. She plays watching one spot on the floor: yours.","char.kenji44.desc":"He works for two sides and has been lying for years. You're the only person he told the truth.","char.isabella45.desc":"She sees how everything ends before it begins. Yours is the first thing she can't see.","char.marco46.desc":"He chases a wave he saw once. He stopped looking the morning you turned up.","char.anouk47.desc":"She repairs watches nobody else understands. She says she can stop time, and with you she tries.","char.rafael48.desc":"He gets paid to find people who don't want to be found. He found you and told no one.","char.selene49.desc":"She lost the sea and doesn't know the way back. She only sings when you're close.","cat.all":"All","cat.group":"Group chats","cat.comics":"Comics","cat.milf":"MILF","cat.asian":"Asian","cat.rpg":"RPG","cat.dom":"Dominant","cat.sub":"Submissive","cat.latina":"Latina","cat.fantasy":"Fantasy","cat.busty":"Busty","cat.blonde":"Blonde","cat.goth":"Goth","cat.bdsm":"BDSM","sort.popular":"Popular","sort.recent":"Recent","sort.trending":"Trending","sort.new":"New","gender.all":"All","gender.female":"Female","gender.male":"Male","gender.nb":"Non-binary"},xl={es:KN,en:ZN},su=[{code:"es",label:"Español"},{code:"en",label:"English"}],bl="en",l0="es";function JN(){const e=pe.get(Ae.lang,bl);return e==="en"||e==="es"?e:bl}let yr=JN();typeof document<"u"&&(document.documentElement.lang=yr);const Ad=new Set;function YN(){document.documentElement.lang=yr,Ad.forEach(e=>e())}function c0(){return yr}function QN(e){e!==yr&&(yr=e,pe.set(Ae.lang,e),YN())}function u0(e){return Ad.add(e),()=>{Ad.delete(e)}}function we(e,t){const r=xl[yr][e]??xl[l0][e]??e;return t?r.replace(/\{(\w+)\}/g,(n,s)=>s in t?String(t[s]):n):r}function ae(){return x.useSyncExternalStore(u0,c0,()=>bl)
